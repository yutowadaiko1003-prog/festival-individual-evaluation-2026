<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第2回検証｜個人別評価</title><style>*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif;background:#f6f7f8;color:#27384b;margin:0;padding:32px 16px}.wrap{max-width:1320px;margin:auto}h1{font-size:30px;margin:12px 0 5px}.sub{color:#748396;font-size:14px}.legend{display:flex;flex-wrap:wrap;gap:9px;margin:24px 0}.chip{border:1px solid #e1e6eb;background:white;border-radius:22px;padding:10px 13px;cursor:pointer;color:#263443;font-weight:600}.chip.off{opacity:.3}.dot{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:7px}.panel{background:white;border:1px solid #e6eaef;border-radius:20px;padding:24px;margin:22px 0;box-shadow:0 6px 20px #1b2b4008}h2{font-size:19px}.scroll{overflow-x:auto}svg{display:block;width:100%;min-width:920px;height:auto}.tip{position:fixed;background:#27384b;color:white;border-radius:12px;padding:12px;pointer-events:none;display:none;z-index:3;box-shadow:0 8px 22px #182b4b33}.note{font-size:13px;color:#65748a;line-height:1.8}.nav a{color:#426ea5}.save{float:right;background:white;border:1px solid #d8dfe6;border-radius:10px;padding:10px 14px;cursor:pointer}@media(max-width:700px){body{padding:16px 8px}.panel{padding:16px 10px}} .people{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0 10px}.person{border:1px solid #dce3ea;background:#fff;color:#28394d;border-radius:14px;padding:12px 18px;font-weight:700;font-size:15px;cursor:pointer}.person.selected{background:#27384b;color:white;border-color:#27384b}.person:focus-visible,.chip:focus-visible{outline:3px solid #7bb6ef;outline-offset:2px}.intro{font-size:14px;color:#6b7a8a}.panel{margin-top:18px} </style></head><body><main class="wrap"><h1>第2回検証｜個人別評価</h1><p class="intro">名前を選ぶと同じページ内でグラフが切り替わります。ブラウザの戻るボタンは不要です。</p><nav class="people" aria-label="回答者切り替え"><button class="person" type="button" onclick="selectPerson(0)">華音さん</button><button class="person" type="button" onclick="selectPerson(1)">ももこさん</button><button class="person" type="button" onclick="selectPerson(2)">夏実さん</button><button class="person" type="button" onclick="selectPerson(3)">ゆうなさん</button><button class="person" type="button" onclick="selectPerson(4)">りおちゃん</button></nav><button class="save" onclick="saveSVG()">SVGで保存</button><h1 id="title"></h1><p class="sub">個人の10段階評価｜5種目の比較｜最優先4項目＋その他5項目</p><div class="legend" id="legend"></div><section class="panel"><h2>PRIORITY 01｜最優先の評価項目</h2><div class="scroll" id="top"></div></section><section class="panel"><h2>PRIORITY 02｜その他の評価項目</h2><div class="scroll" id="bottom"></div></section><p class="note">※ 原票からの転記データです。華音さんの空白は10点として処理しています。その他の未確定値は棒を表示していません。正式公開前に原票との照合を推奨します。</p></main><div class="tip" id="tip" role="status"></div><script>const DATA=[{"person":"華音さん","names":["SHIN長","C力検査","反重力（長座）","キャッチ（反復）","ウチュトレ（VR）"],"labels":["純粋な楽しさ","スタッフとの交流","予想外の面白さ","もう一度やりたい","得意・不得意に関係なく楽しめる","気軽に参加できる","観戦の面白さ","ルールの分かりやすさ","結果への納得感"],"colors":["#6b8ec7","#ff6b61","#a9d9e8","#ffd166","#f7c6a1"],"scores":[[10,5,10,10,10,10,10,10,10],[9,10,5,5,10,10,10,6,8],[10,10,7,9,5,7,10,10,10],[7,9,9,5,4,4,7,9,8],[10,10,10,10,10,8,8,8,5]],"sources":["IMG_3170.JPG","IMG_3171.JPG","IMG_3172.JPG","IMG_3173.JPG","IMG_3174.JPG"]},{"person":"ももこさん","names":["SHIN長","C力検査","反重力（長座）","キャッチ（反復）","ウチュトレ（VR）"],"labels":["純粋な楽しさ","スタッフとの交流","予想外の面白さ","もう一度やりたい","得意・不得意に関係なく楽しめる","気軽に参加できる","観戦の面白さ","ルールの分かりやすさ","結果への納得感"],"colors":["#6b8ec7","#ff6b61","#a9d9e8","#ffd166","#f7c6a1"],"scores":[[8,9,7,9,10,10,8,8,8],[7,8,9,6,10,8,9,9,7],[9,9,9,10,6,7,9,9,10],[5,5,5,5,3,3,8,10,8],[10,10,10,10,10,8,9,9,6]],"sources":["IMG_3175 2.JPG","IMG_3176 2.JPG","IMG_3177 2.JPG","IMG_3178 2.JPG","IMG_3179 2.JPG"]},{"person":"夏実さん","names":["SHIN長","C力検査","反重力（長座）","キャッチ（反復）","ウチュトレ（VR）"],"labels":["純粋な楽しさ","スタッフとの交流","予想外の面白さ","もう一度やりたい","得意・不得意に関係なく楽しめる","気軽に参加できる","観戦の面白さ","ルールの分かりやすさ","結果への納得感"],"colors":["#6b8ec7","#ff6b61","#a9d9e8","#ffd166","#f7c6a1"],"scores":[[8,8,9,8,9,8,8,9,9],[6,7,8,8,7,9,8,8,8],[7,8,9,8,7,8,9,8,8],[7,8,9,8,7,8,9,8,8],[8,7,8,9,7,8,7,7,7]],"sources":["IMG_3180.JPG","IMG_3181.JPG","IMG_3182.JPG","IMG_3183.JPG","IMG_3184.JPG"]},{"person":"ゆうなさん","names":["SHIN長","C力検査","反重力（長座）","キャッチ（反復）","ウチュトレ（VR）"],"labels":["純粋な楽しさ","スタッフとの交流","予想外の面白さ","もう一度やりたい","得意・不得意に関係なく楽しめる","気軽に参加できる","観戦の面白さ","ルールの分かりやすさ","結果への納得感"],"colors":["#6b8ec7","#ff6b61","#a9d9e8","#ffd166","#f7c6a1"],"scores":[[10,8,10,10,10,8,6,10,10],[10,10,10,10,10,10,10,10,8],[10,10,10,10,8,9,10,10,10],[10,8,10,10,8,10,10,10,10],[8,10,10,10,10,10,10,6,10]],"sources":["IMG_3185.JPG","IMG_3186.JPG","IMG_3187.JPG","IMG_3188.JPG","IMG_3189.JPG"]},{"person":"りおちゃん","names":["SHIN長","C力検査","反重力（長座）","キャッチ（反復）","ウチュトレ（VR）"],"labels":["純粋な楽しさ","スタッフとの交流","予想外の面白さ","もう一度やりたい","得意・不得意に関係なく楽しめる","気軽に参加できる","観戦の面白さ","ルールの分かりやすさ","結果への納得感"],"colors":["#6b8ec7","#ff6b61","#a9d9e8","#ffd166","#f7c6a1"],"scores":[[10,2,5,10,10,10,null,10,6],[9,null,8,8,10,10,10,6,10],[10,8,10,10,9,10,10,10,10],[10,6,10,10,10,8,10,10,10],[10,6,10,10,10,8,10,6,10]],"sources":["IMG_3196.JPG","IMG_3197.JPG","IMG_3198.JPG","IMG_3199.JPG","IMG_3200.JPG"]}];let d=DATA[0];let on=d.names.map(()=>true),NS='http://www.w3.org/2000/svg';function e(t,a={},txt){let n=document.createElementNS(NS,t);Object.entries(a).forEach(([k,v])=>n.setAttribute(k,v));if(txt!==undefined)n.textContent=txt;return n}function draw(id,items){const W=1150,H=355,L=44,B=270,T=20,svg=e('svg',{viewBox:`0 0 ${W} ${H}`});for(let v=0;v<=10;v+=2){let y=B-v/10*(B-T);svg.append(e('line',{x1:L,y1:y,x2:W-12,y2:y,stroke:'#e8edf2','stroke-dasharray':'3 6'}));svg.append(e('text',{x:20,y:y+4,fill:'#8190a0','font-size':12},v))}let gw=(W-L-12)/items.length;items.forEach((j,k)=>{let cx=L+gw*(k+.5),sw=Math.min(185,gw*.8),gap=5,bw=(sw-4*gap)/5;d.names.forEach((name,i)=>{let v=d.scores[i][j];if(!on[i]||v===null)return;let x=cx-sw/2+i*(bw+gap),y=B-v/10*(B-T),h=B-y;let r=Math.min(6,bw/4),path=`M${x} ${B}V${y+r}Q${x} ${y} ${x+r} ${y}H${x+bw-r}Q${x+bw} ${y} ${x+bw} ${y+r}V${B}Z`;let bar=e('path',{d:path,fill:d.colors[i]});bar.onmousemove=ev=>{let tip=document.getElementById('tip');tip.style.display='block';tip.style.left=Math.max(5,Math.min(ev.clientX+14,innerWidth-245))+'px';tip.style.top=Math.max(5,Math.min(ev.clientY+14,innerHeight-100))+'px';tip.textContent=name+'｜'+d.labels[j]+'：'+v+' / 10点'};bar.onmouseleave=()=>document.getElementById('tip').style.display='none';svg.append(bar)});svg.append(e('text',{x:cx,y:B+26,'text-anchor':'middle','font-size':12,fill:'#718092'},String(j+1).padStart(2,'0')));let label=d.labels[j];let p=label.length>14?[label.slice(0,14),label.slice(14)]:[label];p.forEach((s,n)=>svg.append(e('text',{x:cx,y:B+46+n*17,'text-anchor':'middle','font-size':12,'font-weight':600,fill:'#27384b'},s)))});document.getElementById(id).replaceChildren(svg)}function refresh(){document.getElementById('title').textContent=d.person+'｜種目別評価';draw('top',[0,1,3,5]);draw('bottom',[2,4,6,7,8]);document.getElementById('legend').replaceChildren(...d.names.map((n,i)=>{let b=document.createElement('button');b.className='chip'+(on[i]?'':' off');b.innerHTML=`<span class="dot" style="background:${d.colors[i]}"></span>${n}`;b.onclick=()=>{on[i]=!on[i];refresh()};return b}))}function saveSVG(){for(let id of ['top','bottom']){let svg=document.querySelector('#'+id+' svg').cloneNode(true);svg.setAttribute('xmlns',NS);let blob=new Blob([new XMLSerializer().serializeToString(svg)],{type:'image/svg+xml'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=d.person+'_'+id+'.svg';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}}function selectPerson(i){d=DATA[i];on=d.names.map(()=>true);document.querySelectorAll('.person').forEach((b,k)=>{b.classList.toggle('selected',k===i);b.setAttribute('aria-pressed',String(k===i))});document.getElementById('tip').style.display='none';refresh();window.scrollTo({top:0,behavior:'smooth'})}selectPerson(0);</script></body></html>
